name: Daily System Audit

on:
  # ── Runs every morning at 04:00 AM UTC (06:00 SAST) ─────────────────────
  schedule:
    - cron: '0 4 * * *'
  # ── Also runs on every push to main (catch regressions immediately) ──────
  push:
    branches: [main]
  # ── Manual trigger from GitHub Actions tab ──────────────────────────────
  workflow_dispatch:

jobs:
  audit:
    name: KIND System Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install root deps (tsx + typescript)
        run: npm ci --ignore-scripts --prefix . 2>/dev/null || npm install tsx typescript --no-save

      - name: Install tsx globally for script runner
        run: npm install -g tsx

      - name: Run system audit
        id: audit
        run: |
          cd /home/runner/work/kind/kind 2>/dev/null || true
          npx tsx scripts/audit.ts 2>&1 | tee audit-report.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-report-${{ github.run_id }}
          path: audit-report.txt
          retention-days: 30

      - name: Create GitHub Issue on failure
        if: steps.audit.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('audit-report.txt', 'utf8');
            const date = new Date().toISOString().slice(0, 10);

            // Check if an open audit issue already exists for today
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'audit,automated',
            });

            const todayIssue = issues.data.find(i => i.title.includes(date));
            if (todayIssue) {
              // Add a comment to existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: todayIssue.number,
                body: `### Audit re-run — ${new Date().toISOString()}\n\`\`\`\n${report.slice(0, 6000)}\n\`\`\``,
              });
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🔴 Daily Audit Failed — ${date}`,
                labels: ['audit', 'automated', 'bug'],
                body: `## K.I.N.D Daily System Audit — ${date}\n\nThe automated morning audit found issues that need attention.\n\n### Report\n\`\`\`\n${report.slice(0, 6500)}\n\`\`\`\n\n> Auto-generated by \`.github/workflows/daily-audit.yml\`. Fix all CRITICAL and HIGH issues to resolve.`,
              });
            }

      - name: Close resolved audit issues
        if: steps.audit.outputs.exit_code == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'audit,automated',
            });
            for (const issue of issues.data) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ Audit passed — all issues resolved as of ${new Date().toISOString()}.`,
              });
            }

      - name: Fail job if audit failed
        if: steps.audit.outputs.exit_code != '0'
        run: |
          echo "::error::Audit found CRITICAL or HIGH issues. Check the audit-report artifact."
          exit 1
