name: KIND System Audit

on:
  schedule:
    - cron: '0 2 * * *'   # 04:00 SAST (UTC+2)
    - cron: '0 14 * * *'  # 16:00 SAST (UTC+2)
  # NOTE: deliberately NOT triggered on push. This is a twice-daily audit; running
  # it on every push to main added a failing check on each commit that could gate
  # Railway's "wait for CI" auto-deploy and added noise. Run manually if needed.
  workflow_dispatch:

jobs:
  audit:
    name: KIND System Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install tsx
        run: npm install -g tsx typescript

      - name: Run audit
        id: audit
        run: |
          npx tsx scripts/audit.ts 2>&1 | tee audit-report.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Upload audit report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-${{ github.run_id }}
          path: audit-report.txt
          retention-days: 90

      - name: Post audit report as GitHub Issue
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs   = require('fs')
            const now  = new Date()
            const sast = new Date(now.getTime() + 2 * 60 * 60 * 1000)
            const date = sast.toISOString().slice(0, 10)
            const time = sast.toISOString().slice(11, 16) + ' SAST'
            const hour = sast.getUTCHours()
            const slot = hour < 10 ? '04:00' : '16:00'

            const report    = fs.readFileSync('audit-report.txt', 'utf8')
            const exitCode  = '${{ steps.audit.outputs.exit_code }}'
            const passed    = exitCode === '0'
            const statusEmoji = passed ? '✅' : '🔴'
            const title = `${statusEmoji} KIND Audit — ${date} ${slot} SAST`

            // Build pending items checklist (always included)
            const PENDING = `
            ## 📋 Pending Action Items

            ### 🔴 Must Do
            - [ ] **Railway deploy** — confirm API is auto-deploying from \`main\` branch
            - [ ] **RESEND_API_KEY** — set in Railway env vars (welcome + nurture emails are silent without it)
            - [ ] **Run MASTER_SCHEMA.sql** — paste \`supabase/MASTER_SCHEMA.sql\` into Supabase SQL Editor if not done
            - [ ] **Paystack KYC** — complete at dashboard.paystack.com → Settings → Compliance

            ### 🟡 High Priority
            - [ ] **Google Workspace** — set up hello@get-kind.com at workspace.google.com
            - [ ] **ANTHROPIC_API_KEY** — confirm set in Railway (Milla + ICP AI needs this)
            - [ ] **ADMIN_SECRET_KEY** — confirm set in Railway
            - [ ] **PORTAL_URL** — confirm set in Railway as https://app.get-kind.com

            ### 🔵 Medium Priority
            - [ ] **Calendly/Cal.com URL** — share your booking link so "Book a Demo" buttons can be wired
            - [ ] **FIGSY_KIND_CLIENT_ID** — add to Railway env vars
            - [ ] **Stripe env vars** — add to activate billing page (STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET)
            - [ ] **Register UK company** — companieshouse.gov.uk (£50, 15 min)
            - [ ] **Upgrade Resend** — paid plan needed for inbound reply routing

            ### ⚪ Launch Day
            - [ ] G2 / Capterra / Product Hunt listings
            - [ ] Set FEATURE_PORTAL_V2=true in Railway when V2 design is ready
            `.trim().split('\n').map(l => l.trim()).join('\n')

            const body = `# K.I.N.D System Audit Report
            **${date} — ${time}**
            Status: ${passed ? '✅ All checks passed' : '🔴 Issues found — see below'}
            Triggered by: ${context.eventName === 'schedule' ? `Scheduled (${slot})` : context.eventName}

            ---

            ## 🔍 Audit Results

            \`\`\`
            ${report.slice(0, 7000)}
            \`\`\`

            ---

            ${PENDING}

            ---
            *Auto-generated by KIND audit workflow. Runs at 04:00 and 16:00 SAST daily.*
            `.trim().split('\n').map(l => l.trim()).join('\n')

            // Close any open audit issues from today for the same time slot
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              state: 'open',
              labels: 'audit',
            })

            for (const issue of open.data) {
              if (issue.title.includes(date) && issue.title.includes(slot)) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo:  context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                })
              }
            }

            // Create new issue for this run
            await github.rest.issues.create({
              owner:  context.repo.owner,
              repo:   context.repo.repo,
              title:  title,
              labels: passed ? ['audit', 'automated'] : ['audit', 'automated', 'bug'],
              body:   body,
            })

      - name: Fail job if audit has critical/high issues
        if: steps.audit.outputs.exit_code != '0'
        run: |
          echo "::error::Audit found CRITICAL or HIGH issues."
          exit 1
