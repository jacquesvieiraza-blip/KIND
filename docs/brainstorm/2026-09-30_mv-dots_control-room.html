isions from client delivery, revenue and product state. Routine activity stays in the background."]], "quick": ["Show next checks", "Change nothing", "Back to control"], "body": "<div class=\"section\"><div class=\"section-head\"><b>Scheduled next</b><span>Persistent business checks</span></div><div class=\"section-body\"><div class=\"flow-row\"><div class=\"flow-ico\">C</div><div><b>Client morning checks</b><p>Review delivery, replies and meeting outcomes across active programmes.</p></div><span class=\"pill good\">Automatic</span></div><div class=\"flow-row\"><div class=\"flow-ico\">F</div><div><b>Founder brief</b><p>Only surface exceptions, risks and decisions \u2014 not routine activity.</p></div><span class=\"pill\">08:00 daily</span></div><div class=\"flow-row\"><div class=\"flow-ico\">H</div><div><b>Pipeline quality check</b><p>Flag clients whose approval rate or meeting rate drops below programme norms.</p></div><span class=\"pill\">Daily</span></div><div class=\"flow-row\"><div class=\"flow-ico\">P</div><div><b>Product truth check</b><p>Flag website / product contradictions before they become production mistakes.</p></div><span class=\"pill warn\">Exception-led</span></div></div></div>"}}; const tabs=[...document.querySelectorAll('.vision-tab')];
